<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Mallik</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="content-wrapper">
      <!-- Profile Section -->
      <section class="profile-section">
        <div class="profile-image-container">
          <img src="me.jpg" alt="Ocean Mallik" class="profile-image">
        </div>
                
        <div class="profile-info">
          <h1 class="profile-name">Ocean Mallik</h1>
          <p class="profile-bio">Studying Software Engineering at Daffodil International University</p>
          <a class="donate-button" href="https://skr.bd/oceanmallik" target="_blank" rel="noopener noreferrer" aria-label="Donate to Ocean Mallik">
            <img src="icons/donate.svg" alt="Donate" class="donate-icon" aria-hidden="true">
            Donate with bKash or Cards
          </a>
        </div>

        <!-- Social Media Icons -->
        <div class="social-media-section" id="social-media-section" aria-live="polite"></div>
      </section>

      <!-- Links Section -->
      <section class="links-section">
        <div class="links-grid" id="links-grid" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <aside class="desktop-qr" aria-label="Mobile access QR code">
    <div class="desktop-qr-wrapper">
      <img src="QR.svg" alt="QR code to open this page on mobile" class="desktop-qr-image">
    </div>
    <p class="desktop-qr-text">Scan to open on mobile</p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
